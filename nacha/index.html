function generate(c,entries,now=new Date()){
 if(!routingOK(c.destination))throw Error('Destination routing number must have a valid ABA checksum.');

 if(!/^[A-Z0-9]$/.test(c.modifier))throw Error('File ID modifier must be one uppercase letter or digit.');

 const ed=date(c.effective);let debit=0,credit=0,hash=0,count=0;const records=[];
 entries.forEach((e,i)=>{if(!routingOK(e.routing))throw Error(`Payment ${i+1}: invalid routing number.`);if(!['22','27','32','37'].includes(e.code))throw Error(`Payment ${i+1}: unsupported transaction code.`);if(!/^\d{1,8}(\.\d{1,2})?$/.test(e.amount))throw Error(`Payment ${i+1}: enter an amount with at most 2 decimal places.`);const [d,f='']=e.amount.split('.');const cents=Number(d)*100+Number(f.padEnd(2,'0'));if(!cents)throw Error(`Payment ${i+1}: amount must be greater than zero.`);if(['27','37'].includes(e.code))debit+=cents;else credit+=cents;hash=(hash+Number(e.routing.slice(0,8)))%1e10;const seq=num(i+1,7);records.push('6'+e.code+e.routing+txt(e.account,17,'Account number')+num(cents,10)+txt(e.identification,15,'Identification',false)+txt(e.name,22,'Receiver name')+'  '+(e.addenda?'1':'0')+c.odfi+seq);count++;if(e.addenda){records.push('705'+txt(e.addenda,80,'Addenda')+'0001'+seq);count++;}});
 const service=debit&&credit?'200':debit?'225':'220';const stamp=`${now.getFullYear()}`.slice(2)+num(now.getMonth()+1,2)+num(now.getDate(),2);const time=num(now.getHours(),2)+num(now.getMinutes(),2);
 const lines=['101 '+c.destination+c.origin.padStart(10,' ')+stamp+time+c.modifier+'094101'+txt(c.destinationName,23,'Destination name',false)+txt(c.originName,23,'Origin name',false)+'        ','5'+service+company+' '.repeat(20)+id+c.sec+txt(c.description,10,'Entry description')+' '.repeat(6)+ed+'   1'+c.odfi+'0000001',...records,'8'+service+num(count,6)+num(hash,10)+num(debit,12)+num(credit,12)+id+' '.repeat(25)+c.odfi+'0000001'];

 else if(t==='7'){if(!batch||!lastEntry){issue(n,'addenda without an entry.');return;}batch.count++;lastEntry.addenda.push(l.slice(3,83).trim());if(l.slice(1,3)!=='05'){warnings.push(`Record ${n}: addenda type ${l.slice(1,3)} is outside validation scope.`);}else if(l.slice(83,87)!=='0001'||l.slice(87,94)!==lastEntry.trace.slice(-7))issue(n,'addenda sequence does not match the entry.');}

 if(!seenHeader)errors.push('Missing file header.');if(batch)errors.push('Unclosed batch.');if(!result.batches.length)errors.push('No batches found.');if(!fc)errors.push('Missing file control.');else for(const [a,b,v,label] of [[1,7,result.batches.length,'batch count'],[7,13,Math.ceil(lines.length/10),'block count'],[13,21,totalCount,'entry/addenda count'],[21,31,totalHash,'entry hash'],[31,43,result.debit,'debit total'],[43,55,result.credit,'credit total']])if(numeric(fc.line,a,b,fc.n)!==v)issue(fc.n,`file ${label} mismatch.`);if(lines.length%10)errors.push('File must be padded to a multiple of 10 records.');return result;
}

return {parse,generate,money};})();
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='inspect',parsed=null,fileName='',showAccounts=false,output='',active='payments';
const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);const date=tomorrow.toLocaleDateString('en-CA');
let config={company:'',companyId:'',destination:'',destinationName:'',origin:'',originName:'',odfi:'',modifier:'A',sec:'PPD',description:'PAYROLL',effective:date};
let payments=[{name:'',routing:'',account:'',code:'22',amount:'',identification:'',addenda:''}];
const icon=(s)=>({file:'▤',arrow:'↗',plus:'+',check:'✓',upload:'↑',download:'↓'}[s]);
function shell(){ $('#app').innerHTML=`<aside><a class="brand" href="#" aria-label="Nacha Studio home"><span class="brand-mark">N</span><span>Nacha<span class="brand-sub">STUDIO</span></span></a><div class="nav-label">WORKSPACE</div><nav><button data-mode="inspect" class="${mode==='inspect'?'selected':''}"><span>▤</span> Inspect a file</button><button data-mode="create" class="${mode==='create'?'selected':''}"><span>⊞</span> Create a file</button></nav><div class="aside-bottom"><div class="privacy-icon">⌑</div><strong>Local by design</strong><p>Your file contents stay in this browser. Nothing is uploaded.</p><a href="https://achdevguide.nacha.org/ach-file-details" target="_blank" rel="noopener">Nacha format reference ↗</a></div></aside><div class="main-wrap"><header><a class="home-link" href="../index.html">← PlentifulHarvest Solutions</a><span class="private-label">⌑ &nbsp; Browser-only processing</span></header><main><div class="page-heading"><div><div class="eyebrow">${mode==='inspect'?'READ & REVIEW':'COMPOSE & EXPORT'}</div><h1>${mode==='inspect'?'Inspect a Nacha file':'Create a Nacha file'}</h1><p>${mode==='inspect'?'Open a file to explore its payments, batches, and record checks.':'Enter your bank settings and payments, then download an ACH file.'}</p></div>${mode==='inspect'?'<button id="sample" class="button secondary">Try a sample ↗</button>':'<span class="pill">PPD / CCD</span>'}</div><div id="workspace"></div></main><footer><span>Nacha Studio</span><span>ACH tools, without the spreadsheet.</span></footer></div><div id="toast" role="status" aria-live="polite"></div>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;shell()});$('.brand').onclick=e=>{e.preventDefault();mode='inspect';shell()};if(mode==='inspect')renderInspect();else renderCreate();}
function stats(p){return `<div class="stats"><div><span>Payments</span><strong>${p.entries.length}</strong><small>Across ${p.batches.length} batch${p.batches.length===1?'':'es'}</small></div><div><span>Total credits</span><strong>${money(p.credit)}</strong><small>Money to receivers</small></div><div><span>Total debits</span><strong>${money(p.debit)}</strong><small>Money from receivers</small></div><div><span>Record checks</span><strong class="${p.errors.length?'bad':'good'}">${p.errors.length?p.errors.length+' issues':p.warnings.length?'Review':'Passed'}</strong><small>${p.lines.length} records · ${p.warnings.length} scope notes</small></div></div>`;}
function renderInspect(){ $('#workspace').innerHTML=`<label class="dropzone" id="drop"><input id="file" type="file" accept=".ach,.txt,.nacha" aria-label="Choose Nacha file"><span class="upload-icon">↑</span><strong>${parsed?'Open another file':'Drop your Nacha file here'}</strong><span>or <u>browse files</u> <span class="muted">· .ach, .txt, .nacha · up to 10 MB</span></span></label>${parsed?`<div class="file-bar"><span>▤ <strong>${esc(fileName)}</strong></span><button class="text-button" id="clear">Clear file ×</button></div>${stats(parsed)}<section class="panel"><div class="panel-top"><div class="tabs">${['payments','batches','checks','raw records'].map(t=>`<button data-tab="${t}" class="${active===t?'active':''}">${t[0].toUpperCase()+t.slice(1)}${t==='checks'&&parsed.errors.length?' ('+parsed.errors.length+')':''}</button>`).join('')}</div><button class="text-button" id="accounts">${showAccounts?'Hide':'Show'} accounts</button></div><div id="inspect-content"></div></section>`:`<div class="empty-grid"><div class="empty-heading"><span class="large-file">▤</span><h2>A clearer view of every record.</h2><p>See payment details and reconcile the file before its next step.</p></div><div class="capabilities"><div><span>01</span><section><strong>Explore payments</strong><p>View receivers, amounts, routing numbers, and addenda.</p></section></div><div><span>02</span><section><strong>Reconcile the structure</strong><p>Check record lengths, counts, hashes, and control totals.</p></section></div><div><span>03</span><section><strong>Keep the original in view</strong><p>Inspect the underlying 94-character records.</p></section></div></div></div>`}<p class="scope-note">Structured inspection supports domestic PPD and CCD. Other entry classes are flagged for review. Format checks do not verify account ownership, authorization, or bank acceptance.</p>`;
 $('#sample').onclick=()=>{const sampleConfig={company:'DEMO COMPANY',companyId:'1234567890',destination:'091000019',destinationName:'DEMO BANK',origin:'1234567890',originName:'DEMO COMPANY',odfi:'09100001',modifier:'A',sec:'PPD',description:'PAYROLL',effective:date};const rows=[{name:'ALEX MORGAN',routing:'091000019',account:'000123456789',code:'22',amount:'2450.00',identification:'EMP001',addenda:'DEMONSTRATION ONLY'},{name:'JORDAN LEE',routing:'091000019',account:'000987654321',code:'32',amount:'1875.50',identification:'EMP002',addenda:''},{name:'SAM TAYLOR',routing:'091000019',account:'000112233445',code:'22',amount:'3120.00',identification:'EMP003',addenda:''}];parsed=parse(generate(sampleConfig,rows));fileName='demo-payroll.ach (sample data)';renderInspect();};$('#file').onchange=e=>readFile(e.target.files[0]);const drop=$('#drop');drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');readFile(e.dataTransfer.files[0])};if(parsed){$('#clear').onclick=()=>{parsed=null;renderInspect()};$('#accounts').onclick=()=>{showAccounts=!showAccounts;renderInspect()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;renderInspect()});renderInspectionContent();}}
async function readFile(file){if(!file)return;if(file.size>10*1024*1024)return toast('Please choose a file smaller than 10 MB.');try{parsed=parse(await file.text());fileName=file.name;active='payments';renderInspect();}catch(e){toast('Could not read file: '+e.message)}}
function renderInspectionContent(){let html='';if(active==='payments'){html=`<div class="table-wrap"><table><thead><tr><th>Receiver / ID</th><th>Account</th><th>Routing</th><th>Type</th><th>Batch</th><th class="right">Amount</th></tr></thead><tbody>${parsed.entries.map(e=>`<tr><td><strong>${esc(e.name)||'Unnamed'}</strong><small>${esc(e.identification)||'—'}</small>${e.addenda.length?`<details><summary>Addenda</summary>${e.addenda.map(a=>`<p>${esc(a)}</p>`).join('')}</details>`:''}</td><td class="mono">${showAccounts?esc(e.account):'•••• '+esc(e.account.slice(-4))}</td><td class="mono">${esc(e.routing)}</td><td><span class="tag">${['27','28','29','37','38','39','47','48','49','55'].includes(e.code)?'Debit':'Credit'}</span><small>Code ${esc(e.code)}</small></td><td>${e.batch}</td><td class="right amount">${money(e.amount)}</td></tr>`).join('')||'<tr><td colspan="6">No readable payment records.</td></tr>'}</tbody></table></div>`;}
 else if(active==='batches')html=`<div class="batch-list">${parsed.batches.map((b,i)=>`<article><div><span class="eyebrow">BATCH ${i+1} · ${esc(b.sec)}</span><h3>${esc(b.company)}</h3><p>${esc(b.description)} · Effective ${esc(b.effective)} (YYMMDD)</p><small>Company ID ${esc(b.id)} · Originating DFI ${esc(b.odfi)}</small></div><div><strong>${b.entries.length} payments</strong><p>${money(b.credit)} credits</p><p>${money(b.debit)} debits</p></div></article>`).join('')}</div>`;
 else if(active==='checks')html=`<div class="checks"><h3>${parsed.errors.length?'Review these file issues':parsed.warnings.length?'Checks completed with scope limitations':'Supported format checks passed'}</h3>${parsed.errors.map(e=>`<p class="error-item">! &nbsp; ${esc(e)}</p>`).join('')}${parsed.warnings.map(e=>`<p class="warning-item">${esc(e)}</p>`).join('')}${!parsed.errors.length?'<p class="success-item">✓ Record structure, routing checksums, entry hashes, counts, and control totals reconcile within the supported scope.</p>':''}<p class="muted">This is a structural check, not a full Nacha rules or bank certification.</p></div>`;
 else html=`<div class="raw-note">${showAccounts?'Full record contents are visible.':'Account numbers are masked. Use “Show accounts” to see original records.'}</div><pre class="raw">${parsed.lines.map((l,i)=>esc(String(i+1).padStart(4,'0')+'  '+(!showAccounts&&l[0]==='6'?l.slice(0,12)+'*'.repeat(17)+l.slice(29):l))).join('\n')}</pre>`;$('#inspect-content').innerHTML=html;}
const field=(label,key,max,placeholder='',type='text',note='')=>`<label>${label}<input name="${key}" type="${type}" ${max?`maxlength="${max}"`:''} value="${esc(config[key])}" placeholder="${placeholder}" ${['destination','odfi'].includes(key)?'inputmode="numeric"':''}>${note?`<small>${note}</small>`:''}</label>`;
function renderCreate(){ $('#workspace').innerHTML=`<form id="builder" novalidate><div class="create-layout"><div><section class="panel form-panel"><div class="section-title"><span class="step">1</span><div><h2>File & bank settings</h2><p>Use the values supplied by your originating bank.</p></div></div><div class="fields">${field('Destination routing','destination',9,'9-digit bank routing')}${field('Destination bank name','destinationName',23,'Optional')}${field('Immediate origin','origin',10,'Bank-assigned origin')}${field('Origin name','originName',23,'Optional')}${field('Originating DFI','odfi',8,'First 8 digits of ODFI routing')}${field('File ID modifier','modifier',1,'A','text','Use a unique modifier for each file on the same day.')}</div></section><section class="panel form-panel"><div class="section-title"><span class="step">2</span><div><h2>Batch details</h2><p>One batch, with any combination of debits and credits.</p></div></div><div class="fields">${field('Company name','company',16,'Name receivers recognize')}${field('Company ID','companyId',10,'10 bank-assigned characters')}<label>Entry class<select name="sec"><option value="PPD" ${config.sec==='PPD'?'selected':''}>PPD — Consumer payments</option><option value="CCD" ${config.sec==='CCD'?'selected':''}>CCD — Corporate payments</option></select></label>${field('Entry description','description',10,'PAYROLL')}${field('Effective entry date','effective',null,'','date')}</div></section><section class="panel form-panel"><div class="section-title"><span class="step">3</span><div><h2>Payments</h2><p>Account numbers keep their leading zeros.</p></div></div><div id="payment-forms"></div><button class="button secondary" type="button" id="add-payment">+ Add payment</button></section></div><div class="review-column"><section class="panel review"><div class="eyebrow">FILE SUMMARY</div><h2>Ready when you are.</h2><div id="draft-summary"></div><hr><p class="muted">94-character records<br>10-record block padding<br>Control totals calculated</p><button class="button primary" type="submit">Review & generate <span>→</span></button><div id="build-errors" role="alert"></div><div id="download-area"></div></section><p class="scope-note">Creates an unbalanced file (no automatic offset entry). Confirm your bank’s required settings, funding arrangement, and effective date before submitting. This app does not send payments.</p></div></div></form>`;renderPayments();$('#add-payment').onclick=()=>{payments.push({name:'',routing:'',account:'',code:'22',amount:'',identification:'',addenda:''});invalidate();renderPayments();};$('#builder').oninput=e=>{if(e.target.name){config[e.target.name]=e.target.value;invalidate();}};$('#builder').onchange=e=>{if(e.target.name){config[e.target.name]=e.target.value;invalidate();}};$('#builder').onsubmit=e=>{e.preventDefault();try{output=generate(config,payments);const test=parse(output);if(test.errors.length)throw Error(test.errors.join(' '));$('#build-errors').textContent='';$('#download-area').innerHTML=`<div class="success-item">✓ ${test.entries.length} payment${test.entries.length===1?'':'s'} generated. Format checks passed.</div><button id="download" type="button" class="button dark">↓ Download .ach</button><details><summary>Preview generated records</summary><p class="muted">Full account numbers are visible below.</p><pre class="raw">${esc(output)}</pre></details>`;$('#download').onclick=()=>{const blob=new Blob([output],{type:'text/plain;charset=us-ascii'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`${config.company.replace(/[^a-z0-9]/gi,'-')}-${config.effective}-${config.modifier}.ach`;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('ACH file downloaded.');};}catch(err){output='';$('#download-area').innerHTML='';$('#build-errors').textContent=err.message;}};}
function invalidate(){output='';$('#download-area').innerHTML='';$('#build-errors').textContent='';updateSummary();}
function updateSummary(){let debit=0,credit=0;payments.forEach(p=>{const n=Number(p.amount)||0;if(['27','37'].includes(p.code))debit+=n;else credit+=n});$('#draft-summary').innerHTML=`<dl><div><dt>Payments</dt><dd>${payments.length}</dd></div><div><dt>Credits</dt><dd>${money(Math.round(credit*100))}</dd></div><div><dt>Debits</dt><dd>${money(Math.round(debit*100))}</dd></div><div><dt>Entry class</dt><dd>${esc(config.sec)}</dd></div></dl>`;}
function renderPayments(){ $('#payment-forms').innerHTML=payments.map((p,i)=>`<article class="payment-form"><div class="payment-heading"><strong>Payment ${String(i+1).padStart(2,'0')}</strong><button class="text-button" type="button" data-remove="${i}" aria-label="Remove payment ${i+1}">Remove ×</button></div><div class="fields">${[['Receiver name','name',22,'Full name or company'],['Routing number','routing',9,'9 digits'],['Account number','account',17,'Account number'],['Amount (USD)','amount',11,'0.00']].map(([l,k,m,ph])=>`<label>${l}<input data-index="${i}" data-key="${k}" maxlength="${m}" value="${esc(p[k])}" placeholder="${ph}" ${k==='amount'?'inputmode="decimal"':k==='routing'?'inputmode="numeric"':''}></label>`).join('')}<label>Transaction<select data-index="${i}" data-key="code">${[['22','Checking · Credit'],['32','Savings · Credit'],['27','Checking · Debit'],['37','Savings · Debit']].map(([v,l])=>`<option value="${v}" ${p.code===v?'selected':''}>${l}</option>`).join('')}</select></label><label>Receiver ID <span class="muted">(optional)</span><input maxlength="15" data-index="${i}" data-key="identification" value="${esc(p.identification)}"></label><label class="full">Addenda <span class="muted">(optional · 80 characters)</span><input maxlength="80" data-index="${i}" data-key="addenda" value="${esc(p.addenda)}" placeholder="Payment-related information"></label></div></article>`).join('');document.querySelectorAll('[data-key]').forEach(e=>{const change=()=>{payments[Number(e.dataset.index)][e.dataset.key]=e.value;invalidate()};e.oninput=change;e.onchange=change;});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{payments.splice(Number(b.dataset.remove),1);invalidate();renderPayments();});updateSummary();}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('visible');setTimeout(()=>$('#toast').classList.remove('visible'),4500);}
shell();
</script></body></html>
